server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 20M;

    # /logo_produk and /poster_produk are named volumes shared with the app
    # container (see docker-compose.yml) — the app writes here, this just
    # serves whatever is currently there. Everything else under public/
    # (theme assets, compiled CSS/JS, images) comes baked into this image
    # from the same build, so it never needs its own volume.

    # The storage:link symlink itself only exists inside the app container's
    # filesystem, not this one, so this app serves storage/app/public
    # directly rather than depending on a symlink resolving across two
    # separate containers.
    location /storage/ {
        alias /var/www/storage/app/public/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
