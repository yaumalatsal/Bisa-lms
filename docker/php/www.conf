; Overrides applied on top of the base image's default www.conf pool (same
; pool name, so unlisted directives like `user`/`group`/`listen` are inherited
; unchanged). Sized for a small VPS: `ondemand` spawns a worker only when a
; request arrives and kills it after being idle, rather than `dynamic`'s
; standing pool of pre-forked workers — the right tradeoff for low, bursty
; traffic on a box with very little RAM to spare.
[www]
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 200
