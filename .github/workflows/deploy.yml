name: Test and deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# A second push while a deploy is still running should wait its turn rather
# than race it onto the same containers.
concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                    MYSQL_DATABASE: bisa_test
                ports: ["3306:3306"]
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, pdo_mysql, exif, pcntl, bcmath, gd, zip, intl
                  coverage: none

            - name: Cache composer packages
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}

            - run: composer install --no-interaction --prefer-dist --no-progress

            - run: cp .env.example .env
            - run: php artisan key:generate

            - name: Wait for MySQL
              run: |
                  for i in $(seq 1 30); do
                    mysqladmin ping -h127.0.0.1 -uroot --silent && break
                    sleep 1
                  done

            - run: vendor/bin/pint --test

            - run: vendor/bin/phpunit
              env:
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: bisa_test
                  DB_USERNAME: root
                  DB_PASSWORD: ""

    deploy:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Deploy over SSH
              env:
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  SSH_HOST: ${{ secrets.VPS_HOST }}
                  SSH_USER: ${{ secrets.VPS_USER }}
                  SSH_PORT: ${{ secrets.VPS_PORT }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

                  ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
                      'bash -ls' < deploy/remote-deploy.sh
